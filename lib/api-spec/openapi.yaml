openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Market analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/overview:
    get:
      operationId: getMarketOverview
      tags: [market]
      summary: Get major Indian market indices
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"
  /stocks/analyze:
    post:
      operationId: analyzeStock
      tags: [market]
      summary: Analyze a stock for swing trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Stock analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAnalysis"
        "400":
          description: Invalid or unavailable symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error]
    AnalyzeInput:
      type: object
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 20
        horizon:
          type: number
          enum: [3, 5, 10, 20]
        period:
          type: string
          enum: [1mo, 3mo, 6mo, 1y, 2y, max]
      required: [symbol]
    Candle:
      type: object
      properties:
        date: { type: string }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        sma20: { type: ["number", "null"] }
        sma50: { type: ["number", "null"] }
        sma200: { type: ["number", "null"] }
        ema20: { type: ["number", "null"] }
        ema50: { type: ["number", "null"] }
      required: [date, open, high, low, close, volume]
    Indicator:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: ["number", "null"] }
        displayValue: { type: string }
        interpretation: { type: string }
        tone:
          type: string
          enum: [positive, negative, neutral, caution]
      required: [key, label, value, displayValue, interpretation, tone]
    Signal:
      type: object
      properties:
        action:
          type: string
          enum: [BUY, HOLD, AVOID]
        strength: { type: number }
        confidence: { type: number }
        risk:
          type: string
          enum: [Low, Moderate, High]
        trend: { type: string }
        momentum: { type: string }
        volatility: { type: string }
        volumeConfirmation: { type: string }
      required: [action, strength, confidence, risk, trend, momentum, volatility, volumeConfirmation]
    TradeSetup:
      type: object
      properties:
        available: { type: boolean }
        entryLow: { type: ["number", "null"] }
        entryHigh: { type: ["number", "null"] }
        stopLoss: { type: ["number", "null"] }
        targetOne: { type: ["number", "null"] }
        targetTwo: { type: ["number", "null"] }
        riskReward: { type: ["number", "null"] }
        quality: { type: string }
        note: { type: string }
      required: [available, entryLow, entryHigh, stopLoss, targetOne, targetTwo, riskReward, quality, note]
    StockAnalysis:
      type: object
      properties:
        symbol: { type: string }
        companyName: { type: string }
        exchange: { type: string }
        currency: { type: string }
        currentPrice: { type: number }
        change: { type: number }
        changePercent: { type: number }
        previousClose: { type: ["number", "null"] }
        dayHigh: { type: ["number", "null"] }
        dayLow: { type: ["number", "null"] }
        week52High: { type: ["number", "null"] }
        week52Low: { type: ["number", "null"] }
        volume: { type: ["number", "null"] }
        averageVolume: { type: ["number", "null"] }
        lastUpdated: { type: string }
        dataSource: { type: string }
        dataDelayed: { type: boolean }
        horizon: { type: number }
        bullishProbability: { type: number }
        bearishProbability: { type: number }
        prediction: { type: string }
        predictionConfidence: { type: string }
        signal: { $ref: "#/components/schemas/Signal" }
        tradeSetup: { $ref: "#/components/schemas/TradeSetup" }
        indicators:
          type: array
          items: { $ref: "#/components/schemas/Indicator" }
        candles:
          type: array
          items: { $ref: "#/components/schemas/Candle" }
        reasons:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        support: { type: ["number", "null"] }
        resistance: { type: ["number", "null"] }
        atr: { type: ["number", "null"] }
        modelInfo:
          type: object
          properties:
            type: { type: string }
            methodology: { type: string }
            features: { type: number }
          required: [type, methodology, features]
      required: [symbol, companyName, exchange, currency, currentPrice, change, changePercent, lastUpdated, dataSource, dataDelayed, horizon, bullishProbability, bearishProbability, prediction, predictionConfidence, signal, tradeSetup, indicators, candles, reasons, warnings, support, resistance, atr, modelInfo]
    MarketIndex:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        value: { type: number }
        changePercent: { type: number }
        trend: { type: string }
      required: [symbol, name, value, changePercent, trend]
    MarketOverview:
      type: object
      properties:
        indices:
          type: array
          items: { $ref: "#/components/schemas/MarketIndex" }
        sentiment: { type: string }
        lastUpdated: { type: string }
        dataSource: { type: string }
        dataDelayed: { type: boolean }
      required: [indices, sentiment, lastUpdated, dataSource, dataDelayed]

